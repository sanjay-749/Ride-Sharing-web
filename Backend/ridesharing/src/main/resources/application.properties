spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridemart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — set a strong secret via env in production (min 32 chars)
jwt.secret=${JWT_SECRET:your-very-long-secret-key-that-is-at-least-32-chars-long-here}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=8080

# CORS Configuration
cors.allowed-origins=http://localhost:5173
